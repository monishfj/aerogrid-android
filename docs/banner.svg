<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="AeroGrid — drone mapping missions for DJI Fly">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a2e"/>
      <stop offset="0.55" stop-color="#0b3b66"/>
      <stop offset="1" stop-color="#0e6aa8"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="0.5" stop-color="#76ff03"/>
      <stop offset="1" stop-color="#ffb300"/>
    </linearGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd60a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd60a" stop-opacity="0.05"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <!-- survey area in perspective with lawnmower path -->
  <g transform="translate(800,40) scale(0.95)">
    <polygon points="40,190 330,190 390,250 -20,250" fill="#00c8ff" fill-opacity="0.12" stroke="#00c8ff" stroke-opacity="0.6"/>
    <polyline points="20,110 60,40 100,110 140,40 180,110 220,40 260,110 300,40 340,110" fill="none" stroke="url(#path)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
    <g stroke="#cfd8dc" stroke-opacity="0.45" stroke-width="2">
      <line x1="20" y1="110" x2="10" y2="245"/><line x1="100" y1="110" x2="110" y2="245"/>
      <line x1="180" y1="110" x2="180" y2="245"/><line x1="260" y1="110" x2="270" y2="245"/>
      <line x1="340" y1="110" x2="360" y2="245"/>
    </g>
    <g fill="#1e88e5" stroke="#ffffff" stroke-width="2">
      <circle cx="60" cy="40" r="6"/><circle cx="140" cy="40" r="6"/><circle cx="220" cy="40" r="6"/><circle cx="300" cy="40" r="6"/>
      <circle cx="100" cy="110" r="6"/><circle cx="180" cy="110" r="6"/><circle cx="260" cy="110" r="6"/>
    </g>
    <circle cx="20" cy="110" r="8" fill="#00c853" stroke="#fff" stroke-width="2"/>
    <circle cx="340" cy="110" r="8" fill="#ff1744" stroke="#fff" stroke-width="2"/>
    <!-- camera field of view -->
    <polygon points="220,40 150,240 290,240" fill="url(#cone)"/>
    <rect x="150" y="232" width="140" height="14" rx="3" fill="#ffd60a" fill-opacity="0.35" stroke="#ffd60a" stroke-opacity="0.8"/>
    <!-- drone -->
    <g transform="translate(220,40)">
      <g stroke="#ffffff" stroke-width="3"><line x1="-16" y1="-10" x2="16" y2="10"/><line x1="-16" y1="10" x2="16" y2="-10"/></g>
      <g fill="none" stroke="#ffffff" stroke-width="2.5"><circle cx="-18" cy="-12" r="7"/><circle cx="18" cy="-12" r="7"/><circle cx="-18" cy="12" r="7"/><circle cx="18" cy="12" r="7"/></g>
      <circle r="5" fill="#ff6d00"/>
    </g>
  </g>

  <text x="64" y="128" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="76" font-weight="800" fill="#ffffff" letter-spacing="-1">AeroGrid</text>
  <text x="66" y="172" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#cfe8ff">Drone mapping missions for DJI Fly — planned on your phone</text>
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="600">
    <rect x="66" y="204" width="132" height="34" rx="17" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.3"/>
    <text x="132" y="227" text-anchor="middle" fill="#ffffff">Quick</text>
    <rect x="208" y="204" width="132" height="34" rx="17" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.3"/>
    <text x="274" y="227" text-anchor="middle" fill="#ffffff">Manual</text>
    <rect x="350" y="204" width="132" height="34" rx="17" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.3"/>
    <text x="416" y="227" text-anchor="middle" fill="#ffffff">Advanced</text>
    <rect x="492" y="204" width="150" height="34" rx="17" fill="#ffd60a" fill-opacity="0.9"/>
    <text x="567" y="227" text-anchor="middle" fill="#071a2e">3D preview</text>
  </g>
</svg>
